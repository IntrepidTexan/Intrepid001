<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT_D</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            /* Background image */
            background-image: url('/IT02/F16ShuttleKSC.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: top center;
            background-attachment: scroll;
        }

        /* Mobile fix */
        @media (max-width: 768px) {
            body {
                background-size: contain;
                background-position: top center;
                background-repeat: no-repeat;
            }
        }

        .overlay {
            min-height: 100vh;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .center {
            text-align: center;
            margin-top: 30px;
        }

        .btn {
            display: block;
            width: 100%;
            max-width: 360px;
            padding: 12px 24px;

            background-color: rgba(0, 123, 255, 0.30);

            color: white;
            text-decoration: none;
            font-size: 20px;
            border-radius: 8px;
            font-weight: bold;
            margin: 10px auto;
            text-align: center;

            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .btn:hover {
            background-color: rgba(0, 123, 255, 0.55);
        }

        .quote {
            text-align: center;
            font-size: 24px;
            line-height: 2;
            font-weight: bold;
            font-style: italic;
            margin-top: 40px;

            color: gold;

            text-shadow:
                -1px -1px 0 royalblue,
                 1px -1px 0 royalblue,
                -1px  1px 0 royalblue,
                 1px  1px 0 royalblue,
                 0px  0px 4px royalblue;
        }

        .back-link {
            color: black;
            font-weight: bold;
            text-shadow: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="overlay">

    <!-- Blank lines to reveal the background image -->
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

    <div class="center">
        <a class="btn"
           href="https://www.ae.utexas.edu/news/2022-ase-em-academy-of-distinguished-alumni?utm_source=copilot.com"
           target="_blank">
           UT Austin AS&EM Academy of Distinguished Alumni
        </a>
    </div>

    <div class="center">
        <a class="btn"
           href="https://www.linkedin.com/in/ronfarris/"
           target="_blank">
           RLF LinkedIn Profile
        </a>
    </div>

    <div class="center">
        <a class="btn"
           href="https://www.usarunway.com/about"
           target="_blank">
           USARunway
        </a>
    </div>

    <div class="center">
        <a class="btn"
           href="https://www.nchmuseum.org/nchm-events/sotl-mans-best-friend"
           target="_blank">
           Stories on the Lawn
        </a>
    </div>

    <div class="quote">
        There are none so blind as those who will not see,<br>
        None so deaf as those who refuse to listen,<br>
        And none so complicit as those who tolerate injustice.
    </div>

    <p class="center">
        <a class="back-link" href="/">
            Back to Home
        </a>
    </p>

</div>

</body>
</html>
