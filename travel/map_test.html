<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Map Test</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
    html, body {
        height: 100%;
        margin: 0;
    }

    /* Full-screen map */
    #map {
        width: 100%;
        height: 100%;
    }

    /* Optional: make pop-up images look nice */
    .popup-img {
        width: 180px;
        border-radius: 6px;
        margin-top: 6px;
    }
</style>
</head>

<body>

<!-- Map container -->
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    // Create the map
    var map = L.map('map').setView([20, 0], 2); // world view

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // -----------------------------
    // TEST PINS (you can delete later)
    // -----------------------------

    // IceLand
    L.marker([63.87929082426407, -22.445294501880408]).addTo(map)
      .bindPopup(`
        <b>IceLand</b><br>
        <img src="photos/iceland/iceland1.jpg" class="popup-img"><br>
        Placeholder photo from IceLand.
      `);

    // Alaska
    L.marker([61.45447766239526, -149.36818757402776]).addTo(map)
      .bindPopup(`
        <b>Alaska</b><br>
        <img src="photos/alaska/alaska1.JPG" class="popup-img"><br>
        Placeholder photo from Alaska.
      `);

    // Texas
    L.marker([29.505248067576897, -100.02638609576937]).addTo(map)
      .bindPopup(`
        <b>Texas</b><br>
        <img src="photos/texas/texas1.JPG" class="popup-img"><br>
        Placeholder photo from Texas.
      `);
</script>

</body>
</html>
