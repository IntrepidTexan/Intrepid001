<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
    html, body {
        height: 100%;
        margin: 0;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    .popup-img {
        width: 180px;
        border-radius: 6px;
        margin-top: 6px;
        cursor: pointer;
    }

    .circle-marker {
        width: 8px;
        height: 8px;
        background-color: #00aaff;
        border-radius: 50%;
    }

    /* Full-screen photo overlay */
    #photo-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.9);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        flex-direction: column;
        touch-action: none;
    }

    #photo-overlay img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 8px;
    }

    /* Back arrow */
    #back-arrow {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 40px;
        color: white;
        cursor: pointer;
        user-select: none;
    }
</style>
</head>

<body>

<div id="map"></div>

<!-- Full-screen photo viewer -->
<div id="photo-overlay">
    <div id="back-arrow" onclick="closePhoto()">←</div>
    <img id="overlay-img" src="">
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    function showPhoto(src) {
        document.getElementById('overlay-img').src = src;
        document.getElementById('photo-overlay').style.display = 'flex';
    }

    function closePhoto() {
        document.getElementById('photo-overlay').style.display = 'none';
    }

    // Swipe-to-close
    let startX = 0;
    let startY = 0;

    const overlay = document.getElementById('photo-overlay');

    overlay.addEventListener('touchstart', function(e) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    });

    overlay.addEventListener('touchend', function(e) {
        let endX = e.changedTouches[0].clientX;
        let endY = e.changedTouches[0].clientY;

        let diffX = Math.abs(endX - startX);
        let diffY = Math.abs(endY - startY);

        if (diffX > 50 || diffY > 50) {
            closePhoto();
        }
    });

    var map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap',
        noWrap: true,
        bounds: [[-90, -180], [90, 180]]
    }).addTo(map);

    const circleIcon = L.divIcon({
        className: 'circle-marker',
        iconSize: [8, 8],
        iconAnchor: [4, 4],
        popupAnchor: [0, -6]
    });

    // Afghanistan

L.marker([34.56924097766155, 69.21269647239585], { icon: circleIcon }).addTo(map)

  `);
