<!-- /travel/index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Travel Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>

html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
}

#map {
    width: 100%;
    height: 100%;
}

.popup-img {
    width: 180px;
    border-radius: 6px;
    margin-top: 6px;
    cursor: pointer;
}

.circle-marker {
    width: 8px;
    height: 8px;
    background-color: #00aaff;
    border-radius: 50%;
}

#photo-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.93);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    overflow: hidden;
    touch-action: none;
}

#photo-overlay img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 8px;
    user-select: none;
    -webkit-user-drag: none;
    transform-origin: center center;
    will-change: transform;
}

#photo-overlay.zoomed {
    cursor: grab;
}

#photo-overlay.dragging {
    cursor: grabbing;
}

#back-arrow {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10001;
    font-size: 40px;
    line-height: 40px;
    color: white;
    cursor: pointer;
    user-select: none;
    padding: 8px;
}

#zoom-indicator {
    position: absolute;
    top: 25px;
    right: 25px;
    z-index: 10001;
    color: white;
    background: rgba(0,0,0,0.45);
    padding: 6px 10px;
    border-radius: 6px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    user-select: none;
    pointer-events: none;
}

#error-message {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20000;
    background: white;
    color: darkred;
    padding: 10px 15px;
    border-radius: 6px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    display: none;
    max-width: 90%;
}

</style>
</head>

<body>

<div id="map"></div>

<div id="error-message"></div>

<div id="photo-overlay">
    <div id="back-arrow" onclick="closePhoto()">←</div>
    <div id="zoom-indicator">1.0×</div>
    <img id="overlay-img" src="" alt="Travel photo">
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

/* ============================================================
   PHOTO VIEWER
   ============================================================ */

const overlay =
    document.getElementById('photo-overlay');

const overlayImg =
    document.getElementById('overlay-img');

const zoomIndicator =
    document.getElementById('zoom-indicator');

let scale = 1;
let translateX = 0;
let translateY = 0;

const MIN_SCALE = 1;
const MAX_SCALE = 5;


function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
}


function updatePhotoTransform() {

    overlayImg.style.transform =
        `translate(${translateX}px, ${translateY}px) scale(${scale})`;

    zoomIndicator.textContent =
        scale.toFixed(1) + '×';

    if (scale > 1.01) {
        overlay.classList.add('zoomed');
    } else {
        overlay.classList.remove('zoomed');
    }
}


function resetPhotoZoom() {

    scale = 1;
    translateX = 0;
    translateY = 0;

    updatePhotoTransform();
}


function showPhoto(src) {

    resetPhotoZoom();

    overlayImg.src = src;

    overlay.style.display = 'flex';
}


function closePhoto() {

    overlay.style.display = 'none';

    overlayImg.src = '';

    resetPhotoZoom();
}


document.addEventListener('keydown', function(e) {

    if (
        e.key === 'Escape' &&
        overlay.style.display === 'flex'
    ) {
        closePhoto();
    }

});


overlay.addEventListener('wheel', function(e) {

    if (overlay.style.display !== 'flex') {
        return;
    }

    e.preventDefault();

    if (e.deltaY < 0) {
        scale += 0.20;
    } else {
        scale -= 0.20;
    }

    scale =
        clamp(
            scale,
            MIN_SCALE,
            MAX_SCALE
        );

    if (scale === 1) {
        translateX = 0;
        translateY = 0;
    }

    updatePhotoTransform();

}, { passive: false });


let mouseDragging = false;

let mouseStartX = 0;
let mouseStartY = 0;

let mouseStartTranslateX = 0;
let mouseStartTranslateY = 0;


overlay.addEventListener('mousedown', function(e) {

    if (scale <= 1) {
        return;
    }

    if (e.target.id === 'back-arrow') {
        return;
    }

    mouseDragging = true;

    mouseStartX = e.clientX;
    mouseStartY = e.clientY;

    mouseStartTranslateX = translateX;
    mouseStartTranslateY = translateY;

    overlay.classList.add('dragging');

    e.preventDefault();

});


window.addEventListener('mousemove', function(e) {

    if (!mouseDragging) {
        return;
    }

    translateX =
        mouseStartTranslateX +
        (e.clientX - mouseStartX);

    translateY =
        mouseStartTranslateY +
        (e.clientY - mouseStartY);

    updatePhotoTransform();

});


window.addEventListener('mouseup', function() {

    mouseDragging = false;

    overlay.classList.remove('dragging');

});


overlayImg.addEventListener('dblclick', function(e) {

    e.preventDefault();

    resetPhotoZoom();

});


let touchMode = '';

let touchStartX = 0;
let touchStartY = 0;

let touchStartTranslateX = 0;
let touchStartTranslateY = 0;

let pinchStartDistance = 0;
let pinchStartScale = 1;


function touchDistance(touch1, touch2) {

    const dx =
        touch2.clientX -
        touch1.clientX;

    const dy =
        touch2.clientY -
        touch1.clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


overlay.addEventListener('touchstart', function(e) {

    if (e.touches.length === 2) {

        touchMode = 'pinch';

        pinchStartDistance =
            touchDistance(
                e.touches[0],
                e.touches[1]
            );

        pinchStartScale = scale;

        return;
    }


    if (e.touches.length === 1) {

        touchStartX =
            e.touches[0].clientX;

        touchStartY =
            e.touches[0].clientY;


        if (scale > 1.01) {

            touchMode = 'pan';

            touchStartTranslateX =
                translateX;

            touchStartTranslateY =
                translateY;

        } else {

            touchMode = 'swipe';

        }
    }

}, { passive: false });


overlay.addEventListener('touchmove', function(e) {

    e.preventDefault();


    if (
        touchMode === 'pinch' &&
        e.touches.length === 2
    ) {

        const currentDistance =
            touchDistance(
                e.touches[0],
                e.touches[1]
            );

        const ratio =
            currentDistance /
            pinchStartDistance;

        scale =
            clamp(
                pinchStartScale * ratio,
                MIN_SCALE,
                MAX_SCALE
            );

        if (scale <= 1.01) {

            scale = 1;

            translateX = 0;
            translateY = 0;

        }

        updatePhotoTransform();

        return;
    }


    if (
        touchMode === 'pan' &&
        e.touches.length === 1
    ) {

        translateX =
            touchStartTranslateX +
            (
                e.touches[0].clientX -
                touchStartX
            );

        translateY =
            touchStartTranslateY +
            (
                e.touches[0].clientY -
                touchStartY
            );

        updatePhotoTransform();

    }

}, { passive: false });


overlay.addEventListener('touchend', function(e) {

    if (
        touchMode === 'swipe' &&
        scale === 1 &&
        e.changedTouches.length > 0
    ) {

        const endX =
            e.changedTouches[0].clientX;

        const endY =
            e.changedTouches[0].clientY;

        const diffX =
            Math.abs(
                endX -
                touchStartX
            );

        const diffY =
            Math.abs(
                endY -
                touchStartY
            );

        if (
            diffX > 70 ||
            diffY > 70
        ) {

            closePhoto();

        }
    }


    if (e.touches.length === 0) {
        touchMode = '';
    }

}, { passive: false });



/* ============================================================
   MAP
   ============================================================ */

const map =
    L.map('map')
     .setView(
        [0, 0],
        1.4
     );


L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 18,
        attribution: '© OpenStreetMap',
        noWrap: true,
        bounds: [
            [-90, -180],
            [90, 180]
        ]
    }
).addTo(map);


const circleIcon =
    L.divIcon({
        className: 'circle-marker',
        iconSize: [8, 8],
        iconAnchor: [4, 4],
        popupAnchor: [0, -6]
    });



/* ============================================================
   HELPER FUNCTIONS
   ============================================================ */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return '';
    }

    return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');

}


function showError(message) {

    const errorBox =
        document.getElementById(
            'error-message'
        );

    errorBox.textContent =
        message;

    errorBox.style.display =
        'block';

}



/* ============================================================
   READ IT_travel_photodata.xlsx

   ONLY SHEET:
   current

   NO HEADER ROW REQUIRED

   COLUMN A = Latitude
   COLUMN B = Longitude
   COLUMN C = Country
   COLUMN D = Description
   COLUMN E = Picture filename

   FIRST LOCATION CAN START IN ROW 1
   ============================================================ */

async function loadPhotoData() {

    try {

        const response =
            await fetch(
                'IT_travel_photodata.xlsx?version=' +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                'Could not load IT_travel_photodata.xlsx'
            );

        }


        const data =
            await response.arrayBuffer();


        const workbook =
            XLSX.read(
                data,
                {
                    type: 'array'
                }
            );


        const sheet =
            workbook.Sheets['current'];


        if (!sheet) {

            throw new Error(
                'Worksheet "current" was not found in IT_travel_photodata.xlsx'
            );

        }


        /*
           header: 1 means:
           DO NOT treat row 1 as column titles.

           Every worksheet row is returned
           as a simple array.
        */

        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    header: 1,
                    defval: ''
                }
            );


        console.log(
            'Photo rows found:',
            rows.length
        );


        rows.forEach(
            function(row, index) {


                /*
                   FIXED COLUMN POSITIONS

                   A = row[0] = Latitude
                   B = row[1] = Longitude
                   C = row[2] = Country
                   D = row[3] = Description
                   E = row[4] = Filename
                */

                const latitude =
                    Number(row[0]);


                const longitude =
                    Number(row[1]);


                const country =
                    String(
                        row[2] || ''
                    ).trim();


                const description =
                    String(
                        row[3] || ''
                    ).trim();


                const filename =
                    String(
                        row[4] || ''
                    ).trim();


                /*
                   IGNORE COMPLETELY BLANK ROWS
                */

                if (
                    row.every(
                        cell =>
                            cell === '' ||
                            cell === null ||
                            cell === undefined
                    )
                ) {

                    return;

                }


                /*
                   VALIDATE COORDINATES
                */

                if (
                    !Number.isFinite(latitude) ||
                    !Number.isFinite(longitude)
                ) {

                    console.warn(
                        'Invalid coordinates on spreadsheet row',
                        index + 1,
                        row
                    );

                    return;

                }


                /*
                   VALIDATE FILENAME
                */

                if (!filename) {

                    console.warn(
                        'Missing filename on spreadsheet row',
                        index + 1
                    );

                    return;

                }


                const photo =
                    'photos/' +
                    filename;


                const safeCountry =
                    escapeHTML(country);


                const safeDescription =
                    escapeHTML(description);


                const safePhotoJS =
                    photo.replaceAll(
                        "'",
                        "\\'"
                    );


                /*
                   CREATE MAP DOT
                */

                L.marker(
                    [
                        latitude,
                        longitude
                    ],
                    {
                        icon: circleIcon
                    }
                )

                .addTo(map)

                .bindPopup(`

                    <b>${safeCountry}</b><br>

                    <img
                        src="${photo}"
                        class="popup-img"
                        onclick="showPhoto('${safePhotoJS}')"
                    >

                    <br>${safeDescription}

                `);

            }
        );


    } catch (error) {

        console.error(error);

        showError(
            'Photo data error: ' +
            error.message
        );

    }

}



/* ============================================================
   LOAD PHOTO DATA
   ============================================================ */

loadPhotoData();

</script>

</body>
</html>
