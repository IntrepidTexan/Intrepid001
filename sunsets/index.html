<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sunsets</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 30px;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }
  .gallery img {
    width: 100%;
    border-radius: 8px;
    object-fit: cover;
  }
</style>
</head>
<body>
<h1>Sunsets</h1>

<div class="gallery">
  <img src="sunset01.jpg" alt="">
  <img src="sunset02.jpg" alt="">
  <img src="sunset03.jpg" alt="">
  <img src="sunset04.png" alt="">
  <img src="sunset05.jpg" alt="">
</div>

</body>
</html>
