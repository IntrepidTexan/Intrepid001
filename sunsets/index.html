<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sunsets Gallery</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 30px;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }
  .gallery img {
    width: 100%;
    border-radius: 8px;
    object-fit: cover;
  }
</style>
</head>
<body>
<h1>Sunsets</h1>
<div class="gallery" id="gallery"></div>

<script>
async function loadImages() {
  const response = await fetch('./');
  const text = await response.text();
  const files = [...text.matchAll(/href="([^"]+\.(jpg|jpeg|png|gif))"/gi)]
                .map(m => m[1]);
  const gallery = document.getElementById('gallery');
  files.forEach(file => {
    const img = document.createElement('img');
    img.src = file;
    gallery.appendChild(img);
  });
}
loadImages();
</script>
</body>
</html>
